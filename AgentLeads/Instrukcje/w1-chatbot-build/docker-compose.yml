services:
  agent-leads:
    build:
      context: .
    image: lsystems/agent-leads:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3050
      HOSTNAME: 0.0.0.0
      TZ: Europe/Warsaw
    ports:
      - "3050:3050"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3050/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  daily-leads:
    image: lsystems/agent-leads:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      AGENT_BASE_URL: http://agent-leads:3050
      REPORT_TIMEZONE: Europe/Warsaw
      REPORT_HOUR: "8"
      REPORT_MINUTE: "0"
      REPORT_RECIPIENTS: robert.pawlak@L-Systems.pl,adam.gebski@L-Systems.pl,pawel.piekarski@L-Systems.pl,jakub.gebski@L-Systems.pl
    command: ["node", "scripts/daily-report-scheduler.mjs"]
    depends_on:
      agent-leads:
        condition: service_healthy
    volumes:
      - scheduler-data:/app/data

volumes:
  scheduler-data:
